<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Добавление текста для TTR-анализа">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/ttr-assets/ttr_styles.css?v=lab1-layout-sync">
</head>
<body class="ttr-page-body">
  <main class="ttr-phone ttr-page">
    <header class="ttr-page-header">
      <h1>Добавление</h1>
      <p>Заполните данные нового текста.</p>
    </header>

    <form class="ttr-editor">
      <section class="ttr-file-picker ttr-file-picker--media" aria-label="Выбор медиа">
        <label class="ttr-file-picker__card">
          <span class="ttr-file-picker__plus" aria-hidden="true">+</span>
          <span>Видео</span>
          <input class="ttr-file-picker__input" type="file"
                 name="ttr_video_file" accept="video/*">
        </label>

        <label class="ttr-file-picker__card">
          <span class="ttr-file-picker__plus" aria-hidden="true">+</span>
          <span>Изображение</span>
          <input class="ttr-file-picker__input" type="file"
                 name="ttr_image_file" accept="image/*">
        </label>
      </section>

      <section class="ttr-editor__card">
        <label>Название
          <input name="work_title" value="{{ ttr_text.work_title }}">
        </label>

        <label>Автор
          <input name="author_name" value="{{ ttr_text.author_name }}">
        </label>

        <label>Год публикации
          <input type="number" name="publication_year"
                 value="{{ ttr_text.publication_year }}">
        </label>

        <label>Краткое описание
          <textarea name="short_description" rows="3">{{ ttr_text.short_description }}</textarea>
        </label>

        <label>Текст произведения
          <textarea name="text_content" rows="9">{{ ttr_text.text_content }}</textarea>
        </label>
      </section>
    </form>

    {% include "_ttr_bottom_nav.html" %}
  </main>
</body>
</html>
