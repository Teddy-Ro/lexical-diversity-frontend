<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Лента текстов для TTR-анализа">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/ttr-assets/ttr_styles.css?v=lab1-layout-sync">
</head>
<body class="ttr-page-body ttr-feed-body">
  <main class="ttr-phone ttr-phone--feed">
    <article class="ttr-feed-card"
             data-ttr-image-url="{{ ttr_text.ttr_image_url }}"
             data-ttr-video-url="{{ ttr_text.ttr_video_url }}">
      <video class="ttr-feed-card__video" autoplay muted loop playsinline
             poster="{{ ttr_text.ttr_image_url }}">
        <source src="{{ ttr_text.ttr_video_url }}" type="video/webm">
        Ваш браузер не поддерживает видео.
      </video>
      <div class="ttr-feed-card__shade"></div>

      <aside class="ttr-feed-rail" aria-label="Параметры текста">
        <div class="ttr-feed-rail__like" aria-label="Отметок нравится: {{ ttr_text.ttr_like_count }}">
          <span class="ttr-feed-rail__icon" aria-hidden="true">♥</span>
          <strong>{{ ttr_text.ttr_like_count }}</strong>
        </div>

        <div class="ttr-feed-rail__metric"
             title="{{ ttr_text.unique_token_count }} уникальных токенов">
          <strong>{{ ttr_text.compact_unique_token_count }}</strong>
          <span>уник.<br>токенов</span>
        </div>

        <div class="ttr-feed-rail__metric"
             title="Длина текста: {{ ttr_text.text_length }} токенов">
          <strong>{{ ttr_text.compact_text_length }}</strong>
          <span>длина<br>текста</span>
        </div>

        <a class="ttr-feed-rail__next"
           href="/ttr-texts/{{ ttr_text.ttr_text_id }}?next=true"
           aria-label="Показать следующий текст">→</a>
      </aside>

      <section class="ttr-feed-copy">
        <h1>{{ ttr_text.work_title }}</h1>
        <p class="ttr-feed-copy__description">{{ ttr_text.short_description }}</p>
      </section>
    </article>

    {% include "_ttr_bottom_nav.html" %}
  </main>
</body>
</html>
